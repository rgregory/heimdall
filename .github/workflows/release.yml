name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
      DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
      DEVELOPER_ID: ${{ secrets.DEVELOPER_ID }}
      NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
      NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
      NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test
        run: swift test
      - name: Import signing certificate
        if: ${{ env.DEVELOPER_ID_P12 != '' }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"; PW="$(uuidgen)"
          security create-keychain -p "$PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$PW" "$KC"
          echo "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$DEVELOPER_ID_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$PW" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
      - name: Store notary credentials
        if: ${{ env.NOTARY_APPLE_ID != '' }}
        run: xcrun notarytool store-credentials heimdall --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD"
      - name: Build
        env:
          HEIMDALL_VERSION: ${{ github.ref_name }}
        run: |
          if [ -n "$NOTARY_APPLE_ID" ]; then export NOTARY_PROFILE=heimdall; fi
          scripts/build-app.sh
          if ! ls build/Heimdall-*.zip >/dev/null 2>&1; then
            ditto -c -k --keepParent build/Heimdall.app "build/Heimdall-${HEIMDALL_VERSION#v}.zip"
          fi
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" build/Heimdall-*.zip build/heimdall-scan --generate-notes --verify-tag
