name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build (app, CLI, core)
        run: swift build -c release
      - name: Test
        run: swift test
      - name: Package Heimdall.app
        run: scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Heimdall
          path: |
            build/Heimdall.app
            build/heimdall-scan
